# The workspace the e2e checks run in: this checkout as its python SDK, and
# the e2e checks of it. The e2e playground puts this file in place of the
# workspace's dagger.toml.

[modules.e2e]
source = ".dagger/modules/e2e"

[modules.python-sdk]
source = "."
check.skip = ["*"]

[sdks.python]
module = "python-sdk"
